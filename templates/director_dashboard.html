<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель директора склада</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .container-main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .header {
            position: relative;
            margin-bottom: 40px;
        }
        
        .logout-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .location-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            margin-bottom: 40px;
        }
        
        .location-header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .location-header p {
            font-size: 1.1rem;
            opacity: 0.95;
            margin: 0;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border: none;
        }
        
        .card-header h3 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .owners-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .owner-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.2);
        }
        
        .no-data {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 30px 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .date-navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn-date {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-date:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        #dateNavigator {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            background: white;
            cursor: pointer;
        }
        
        .day-section {
            margin-bottom: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            background: white;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .day-section:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
        }
        
        .day-header {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            padding: 18px 25px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .day-date {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }
        
        .day-status {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .day-status.locked {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        
        .employees-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .employees-table thead {
            background: #f8f9fa;
        }
        
        .employees-table th {
            padding: 15px 25px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .employees-table td {
            padding: 12px 25px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .employees-table tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-control {
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        
        .stats-section {
            background: linear-gradient(135deg, #fff9e6 0%, #ffe6e6 100%);
            border-left: 4px solid #ffc107;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        
        .stat-input-group {
            display: flex;
            flex-direction: column;
        }
        
        .stat-input-group label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #555;
        }
        
        .day-section.active {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .day-status.active {
            background: #d4edda;
            color: #155724;
            font-weight: 700;
        }
        
        .owner-badge-small {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }
        
        /* Вкладки */
        .tabs-container {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tab-btn:hover {
            color: #667eea;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Сетка статистики для просмотра */
        .stats-view-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .stat-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        
        .stat-card.today {
            border-color: #ffc107;
            background: linear-gradient(135deg, #fffbf0 0%, #fff9e6 100%);
            border-width: 3px;
        }
        
        .stat-card-date-header {
            font-size: 0.95rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stat-card-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.9rem;
        }
        
        .stat-label {
            color: #666;
            font-weight: 500;
        }
        
        .stat-value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Список работников */
        .employees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .employee-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .employee-card:hover {
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.1);
        }
        
        .employee-name {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .employee-owner {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <div class="header">
            <button class="logout-btn" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Выход
            </button>
        </div>

        <div class="location-header">
            <h1 id="locationName"><i class="bi bi-building"></i> Загрузка...</h1>
            <p id="locationInfo"><i class="bi bi-calendar-event"></i> Дата сегодня</p>
        </div>

        <!-- Владельцы -->
        <div class="card">
            <div class="card-header">
                <h3><i class="bi bi-people-fill"></i> Привязанные владельцы</h3>
            </div>
            <div class="card-body">
                <div class="owners-grid" id="ownersList">
                    <div class="no-data">Загрузка владельцев...</div>
                </div>
            </div>
        </div>

        <!-- Навигация по датам -->
        <div class="date-navigation">
            <button class="btn-date" onclick="previousDay()"><i class="bi bi-chevron-left"></i> Назад</button>
            <input type="date" id="dateNavigator">
            <button class="btn-date" onclick="nextDay()">Вперед <i class="bi bi-chevron-right"></i></button>
        </div>

        <!-- Вкладки для переключения между статистикой и работниками -->
        <div class="tabs-container">
            <button class="tab-btn active" id="statsTabBtn" onclick="switchTab('stats')">
                <i class="bi bi-graph-up"></i> Статистика
            </button>
            <button class="tab-btn" id="employeesTabBtn" onclick="switchTab('employees')">
                <i class="bi bi-people"></i> Работники
            </button>
        </div>

        <!-- Вкладка: Статистика -->
        <div id="statsTab" class="tab-content active">
            <!-- Редактируемая статистика только для сегодня -->
            <div id="editableStatsSection" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-pencil-square"></i> Редактирование статистики (сегодня)</h3>
                    </div>
                    <div class="card-body">
                        <div class="stats-section">
                            <div class="stats-grid">
                                <div class="stat-input-group">
                                    <label for="arrived_actual"><i class="bi bi-person-check"></i> Прибыло (факт)</label>
                                    <input type="number" id="arrived_actual" class="form-control" placeholder="0">
                                </div>
                                <div class="stat-input-group">
                                    <label for="expected"><i class="bi bi-calendar2-check"></i> Ожидалось</label>
                                    <input type="number" id="expected" class="form-control" placeholder="0">
                                </div>
                                <div class="stat-input-group">
                                    <label for="outsourcing"><i class="bi bi-arrow-repeat"></i> Аутсорсинг</label>
                                    <input type="number" id="outsourcing" class="form-control" placeholder="0">
                                </div>
                                <div class="stat-input-group">
                                    <label for="overtime"><i class="bi bi-hourglass-split"></i> Переработки</label>
                                    <input type="number" id="overtime" class="form-control" placeholder="0">
                                </div>
                                <div class="stat-input-group">
                                    <label for="lunch"><i class="bi bi-cup-hot"></i> Обед</label>
                                    <input type="number" id="lunch" class="form-control" placeholder="0">
                                </div>
                            </div>
                            <button class="btn-save" onclick="saveStats()">
                                <i class="bi bi-check-circle"></i> Сохранить статистику
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Статистика всех дней для просмотра -->
            <div id="statsViewContainer">
                <div class="card">
                    <div class="card-body">
                        <div class="no-data">Загрузка статистики...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладка: Работники -->
        <div id="employeesTab" class="tab-content">
            <div id="employeesContainer">
                <div class="card">
                    <div class="card-body">
                        <div class="no-data">Загрузка работников...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для просмотра истории -->
    <div class="modal fade" id="employeeHistoryModal" tabindex="-1" aria-labelledby="employeeHistoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="employeeHistoryModalLabel">История привязок</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="historyContent">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui_helpers.js?v=2"></script>
    <script src="/static/js/director_dashboard.js?v=2"></script>
</body>
</html>
