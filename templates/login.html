<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>
  <body>
    <div
      class="d-flex justify-content-center align-items-center min-vh-100 bg-light"
    >
      <div class="card shadow-lg p-4" style="width: 400px">
        <h2 class="text-center text-primary mb-4">Авторизация</h2>
        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="username"
              placeholder="Введите email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Введите пароль"
              required
            />
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <!-- <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div> -->
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <div id="error-message" class="text-danger mt-3" style="display: none">
          Ошибка авторизации
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui_helpers.js?v=2"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script> -->
    <script src="/static/js/login.js?v=2"></script>
  </body>
</html>
